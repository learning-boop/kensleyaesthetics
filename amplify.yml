version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22
        # Chrome shared libs for Puppeteer (Amazon Linux 2023 build image).
        # If any package name fails, check `dnf provides` or run the prerender in GitHub Actions instead.
        - sudo dnf install -y nss atk at-spi2-atk cups-libs libXcomposite libXdamage libXrandr libgbm pango alsa-lib libxkbcommon libdrm mesa-libgbm || true
        - npm ci
        # Clear stale webpack/babel/eslint build cache so Amplify's cached node_modules
        # do not cause a dual-cache conflict between consecutive builds.
        - rm -rf node_modules/.cache || true
    build:
      commands:
        - npm run build          # runs prebuild (sitemap) -> react-scripts build -> postbuild (prerender)
  customRules:
    # www → non-www permanent redirect
    - source: 'https://www.kensleyaesthetics.com/<*>'
      target: 'https://kensleyaesthetics.com/<*>'
      status: '301'
    # SPA fallback for any URL that didn't get a prerendered static file
    - source: '</^[^.]+$|\.(?!(css|gif|ico|jpg|js|png|txt|svg|woff|woff2|ttf|map|json|xml|mp4|webp)$)([^.]+$)/>'
      target: '/index.html'
      status: '200'
  artifacts:
    baseDirectory: build
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - ~/.cache/puppeteer/**/*
