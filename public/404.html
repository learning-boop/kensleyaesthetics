<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Page Not Found | Kensley Aesthetics</title>
  <style>
    :root {
      --color-primary: #1a1a1a;
      --color-gold: #b8924a;
      --color-cream: #faf8f5;
      --font-serif: 'Cormorant', Georgia, serif;
      --font-sans: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-sans);
      background: var(--color-cream);
      color: var(--color-primary);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      text-align: center;
    }
    .nf-eyebrow {
      letter-spacing: .2em;
      text-transform: uppercase;
      font-size: .75rem;
      opacity: .5;
      margin-bottom: .75rem;
    }
    .nf-title {
      font-family: var(--font-serif);
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 400;
      line-height: 1.2;
      margin-bottom: 1rem;
    }
    .nf-body {
      max-width: 480px;
      font-size: .95rem;
      line-height: 1.6;
      opacity: .7;
      margin-bottom: 2.5rem;
    }
    .nf-links {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      gap: .75rem;
      justify-content: center;
    }
    .nf-link {
      display: inline-block;
      padding: .6rem 1.4rem;
      border: 1px solid var(--color-primary);
      color: var(--color-primary);
      text-decoration: none;
      font-size: .8rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      transition: background .25s, color .25s;
    }
    .nf-link:hover {
      background: var(--color-primary);
      color: var(--color-cream);
    }
    .nf-link--primary {
      background: var(--color-primary);
      color: var(--color-cream);
    }
    .nf-link--primary:hover {
      background: transparent;
      color: var(--color-primary);
    }
    .nf-brand {
      position: absolute;
      top: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      font-family: var(--font-serif);
      font-size: 1.1rem;
      letter-spacing: .15em;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--color-primary);
    }
  </style>
  <!--
    SPA redirect: if the hosting platform serves this 404.html for unknown paths,
    redirect to index.html with the original path so React Router can handle it.
  -->
  <script>
    // Only redirect if we're on a path that the SPA should handle
    // (not for actual missing static assets like .js, .css, .png, etc.)
    (function () {
      var ext = location.pathname.split('.').pop();
      var staticExts = ['js','css','png','jpg','jpeg','webp','avif','svg','ico','woff','woff2','json','map','txt','xml'];
      if (staticExts.indexOf(ext) === -1) {
        // Store the path and redirect to root so the SPA router picks it up
        sessionStorage.setItem('spa-redirect', location.pathname + location.search + location.hash);
      }
    })();
  </script>
</head>
<body>
  <a href="/" class="nf-brand">Kensley Aesthetics</a>

  <p class="nf-eyebrow">Error 404</p>
  <h1 class="nf-title">We couldn't find that page</h1>
  <p class="nf-body">
    The link may be out of date, or the page may have moved.
    Here are the pages people visit most &mdash; or call us on
    <a href="tel:03334442013" style="color:inherit">0333&nbsp;444&nbsp;2013</a>.
  </p>

  <ul class="nf-links">
    <li><a href="/" class="nf-link nf-link--primary">Home</a></li>
    <li><a href="/treatments" class="nf-link">Treatments</a></li>
    <li><a href="/prices" class="nf-link">Prices</a></li>
    <li><a href="/gallery" class="nf-link">Before &amp; After</a></li>
    <li><a href="/about" class="nf-link">About</a></li>
    <li><a href="/blog" class="nf-link">Blog</a></li>
  </ul>

  <script>
    // If we stored a redirect path, navigate there via the SPA
    (function () {
      var redirect = sessionStorage.getItem('spa-redirect');
      if (redirect) {
        sessionStorage.removeItem('spa-redirect');
        window.location.replace(redirect);
      }
    })();
  </script>
</body>
</html>
